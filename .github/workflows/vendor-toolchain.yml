name: Vendor GBA toolchain

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-toolchain.yml'

permissions:
  contents: write

concurrency:
  group: vendor-gba-toolchain-main
  cancel-in-progress: false

jobs:
  vendor-linux-x86_64:
    runs-on: ubuntu-24.04
    env:
      BINUTILS_VERSION: '2.47'
      AGBCC_COMMIT: 'da598c1d918402c42c0c0d7128ba14567f3175e9'
      MGBA_VERSION: '0.10.5'
      VENDOR_ROOT: 'vendor/toolchain/linux-x86_64'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential bison flex texinfo curl xz-utils ca-certificates

      - name: Build portable ARM binutils
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _toolbuild "$VENDOR_ROOT"
          mkdir -p _toolbuild "$VENDOR_ROOT/source" "$VENDOR_ROOT/bin"
          curl -fL --retry 3 "https://ftp.gnu.org/gnu/binutils/binutils-${BINUTILS_VERSION}.tar.xz" -o "_toolbuild/binutils-${BINUTILS_VERSION}.tar.xz"
          cp "_toolbuild/binutils-${BINUTILS_VERSION}.tar.xz" "$VENDOR_ROOT/source/"
          tar -xJf "_toolbuild/binutils-${BINUTILS_VERSION}.tar.xz" -C _toolbuild
          mkdir -p _toolbuild/binutils-build
          pushd _toolbuild/binutils-build
          ../binutils-${BINUTILS_VERSION}/configure \
            --target=arm-none-eabi \
            --prefix="$GITHUB_WORKSPACE/$VENDOR_ROOT/binutils" \
            --disable-nls --disable-werror --disable-gdb --disable-sim
          make -j2
          make install
          popd
          for tool in "$VENDOR_ROOT/binutils/bin"/arm-none-eabi-*; do
            name="$(basename "$tool")"
            ln -sfn "../binutils/bin/$name" "$VENDOR_ROOT/bin/$name"
          done

      - name: Vendor agbcc release and matching source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$VENDOR_ROOT/agbcc" "$VENDOR_ROOT/source"
          curl -fL --retry 3 https://github.com/pret/agbcc/releases/download/release/agbcc.tar.gz -o _toolbuild/agbcc.tar.gz
          echo 'bcf0197e3e27d8e08506a142e25fa68ea7f6679a98347a6406804eb3f9ff4d29  _toolbuild/agbcc.tar.gz' | sha256sum -c -
          tar -xzf _toolbuild/agbcc.tar.gz -C "$VENDOR_ROOT/agbcc"
          cp _toolbuild/agbcc.tar.gz "$VENDOR_ROOT/source/agbcc-release.tar.gz"
          curl -fL --retry 3 "https://github.com/pret/agbcc/archive/${AGBCC_COMMIT}.tar.gz" -o "$VENDOR_ROOT/source/agbcc-source-${AGBCC_COMMIT}.tar.gz"

      - name: Vendor mGBA emulator and source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$VENDOR_ROOT/mgba" "$VENDOR_ROOT/source" "$VENDOR_ROOT/licenses"
          curl -fL --retry 3 "https://github.com/mgba-emu/mgba/releases/download/${MGBA_VERSION}/mGBA-${MGBA_VERSION}-appimage-x64.appimage" -o "$VENDOR_ROOT/mgba/mGBA.AppImage"
          echo 'fdf0a5c1588e1606c38315735cf48a9f9dca3573f32a3947ebc956f8297e85cd  '"$VENDOR_ROOT/mgba/mGBA.AppImage" | sha256sum -c -
          chmod 0755 "$VENDOR_ROOT/mgba/mGBA.AppImage"
          curl -fL --retry 3 "https://github.com/mgba-emu/mgba/archive/refs/tags/${MGBA_VERSION}.tar.gz" -o "$VENDOR_ROOT/source/mgba-${MGBA_VERSION}.tar.gz"
          curl -fL --retry 3 "https://raw.githubusercontent.com/mgba-emu/mgba/${MGBA_VERSION}/LICENSE" -o "$VENDOR_ROOT/licenses/mGBA-LICENSE"
          cat > "$VENDOR_ROOT/bin/mgba" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          export APPIMAGE_EXTRACT_AND_RUN=1
          if [[ -z "${DISPLAY:-}" && -z "${WAYLAND_DISPLAY:-}" ]]; then export QT_QPA_PLATFORM="${QT_QPA_PLATFORM:-offscreen}"; fi
          exec "$HERE/../mgba/mGBA.AppImage" "$@"
          EOF
          chmod 0755 "$VENDOR_ROOT/bin/mgba"

      - name: Record manifest
        shell: bash
        run: |
          set -euo pipefail
          cat > "$VENDOR_ROOT/VERSIONS.md" <<EOF
          # Vendored GBA toolchain — Linux x86_64
          - GNU binutils: ${BINUTILS_VERSION}, target arm-none-eabi
          - agbcc source commit: ${AGBCC_COMMIT}
          - mGBA: ${MGBA_VERSION}
          - ROMs/keys/firmware: not included
          EOF
          cat > "$VENDOR_ROOT/activate.sh" <<'EOF'
          #!/usr/bin/env bash
          ROOT="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          export PATH="$ROOT/bin:$ROOT/binutils/bin:$PATH"
          EOF
          chmod 0755 "$VENDOR_ROOT/activate.sh"
          (cd "$VENDOR_ROOT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Smoke test
        run: |
          "$VENDOR_ROOT/bin/arm-none-eabi-as" --version
          "$VENDOR_ROOT/bin/arm-none-eabi-ld" --version
          test -x "$VENDOR_ROOT/mgba/mGBA.AppImage"
          find "$VENDOR_ROOT/agbcc" -type f | head

      - name: Commit vendored toolchain
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _toolbuild
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$VENDOR_ROOT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'tooling: vendor GBA toolchain binaries'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
